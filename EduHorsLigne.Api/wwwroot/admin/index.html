<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ÉduHors-Ligne · Administration</title>
<style>
  :root { --p:#1F6F5C; --a:#F2A900; --err:#B3261E; --ok:#2E7D32; --bg:#FAFAF7; --fg:#1b1b1b; --card:#fff; --line:#d9d9d2; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121212; --fg:#eee; --card:#1e1e1e; --line:#3a3a3a; } }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  header { background:var(--p); color:#fff; padding:12px 16px; display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; }
  main { max-width:1100px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; margin-bottom:16px; }
  input, select, textarea, button { font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--fg); }
  textarea { width:100%; min-height:180px; font-family:ui-monospace, monospace; font-size:13px; }
  button { cursor:pointer; min-height:40px; }
  button.primary { background:var(--p); color:#fff; border-color:var(--p); }
  button.warn { border-color:var(--err); color:var(--err); }
  label { display:block; margin:8px 0 2px; font-size:14px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  .wrap { overflow-x:auto; }
  .tag { padding:2px 8px; border-radius:10px; font-size:12px; border:1px solid var(--line); }
  .Publiee { color:var(--ok); border-color:var(--ok); } .Archivee { color:var(--err); border-color:var(--err); } .EnRelecture { color:var(--a); border-color:var(--a); }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:end; }
  .msg { margin:8px 0; min-height:1.4em; } .msg.err { color:var(--err); } .msg.ok { color:var(--ok); }
  .stats span { margin-right:16px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<header>
  <strong>ÉduHors-Ligne · Administration du contenu</strong>
  <span><span id="who"></span> <button id="logout" hidden>Déconnexion</button></span>
</header>
<main>
  <section id="login" class="card">
    <h2>Connexion administrateur</h2>
    <label for="lid">Identifiant (e-mail)</label><input id="lid" type="email" autocomplete="username" value="admin@eduhorsligne.cm">
    <label for="lpw">Mot de passe</label><input id="lpw" type="password" autocomplete="current-password">
    <p><button class="primary" id="btnLogin">Se connecter</button></p>
    <div id="loginMsg" class="msg"></div>
  </section>

  <section id="app" hidden>
    <div class="card stats" id="stats"></div>

    <div class="card">
      <div class="row">
        <div><label for="fStatut">Statut</label>
          <select id="fStatut"><option value="">Tous</option><option>Brouillon</option><option>EnRelecture</option><option>Publiee</option><option>Archivee</option></select></div>
        <button id="refresh">Actualiser</button>
        <button id="newLesson" class="primary">Nouvelle leçon</button>
      </div>
      <div class="msg" id="listMsg"></div>
      <div class="wrap"><table>
        <thead><tr><th>Classe · Matière</th><th>Chapitre</th><th>Leçon</th><th>Statut</th><th>Version</th><th>Téléch.</th><th>Actions</th></tr></thead>
        <tbody id="rows"></tbody>
      </table></div>
    </div>

    <div class="card" id="editor" hidden>
      <h2 id="edTitle">Leçon</h2>
      <div class="row">
        <div><label for="edChap">Chapitre</label><select id="edChap"></select></div>
        <div><label for="edName">Titre</label><input id="edName" size="40"></div>
        <div><label for="edDur">Durée (min)</label><input id="edDur" type="number" min="0" value="10" style="width:90px"></div>
      </div>
      <label for="edBlocks">Contenu : liste de blocs JSON (Heading, Paragraph, Definition, Example, BulletList, Table, Formula)</label>
      <textarea id="edBlocks" spellcheck="false">[]</textarea>
      <div class="row" style="margin-top:8px">
        <button class="primary" id="edSave">Enregistrer</button>
        <input type="file" id="edZip" accept=".zip"><button id="edUpload">Téléverser un paquet ZIP</button>
      </div>
      <div class="msg" id="edMsg"></div>
    </div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
let token = sessionStorage.getItem('edu_admin_token') || '';
let editingId = null;

async function api(path, opts = {}) {
  const headers = Object.assign({ Authorization: 'Bearer ' + token }, opts.headers || {});
  if (opts.json !== undefined) { headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(opts.json); }
  const res = await fetch('/api/admin' + path, Object.assign({}, opts, { headers }));
  if (res.status === 401 || res.status === 403) { showLogin(); throw new Error('Session expirée ou accès refusé.'); }
  const text = await res.text();
  const data = text ? JSON.parse(text) : null;
  if (!res.ok) throw new Error((data && data.message) || ('Erreur ' + res.status));
  return data;
}
const say = (id, text, cls) => { $(id).textContent = text || ''; $(id).className = 'msg ' + (cls || ''); };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function showLogin() { token = ''; sessionStorage.removeItem('edu_admin_token'); $('login').hidden = false; $('app').hidden = true; $('logout').hidden = true; }
async function showApp() { $('login').hidden = true; $('app').hidden = false; $('logout').hidden = false; await Promise.all([loadStats(), loadLessons(), loadChapters()]); }

$('btnLogin').onclick = async () => {
  say('loginMsg', 'Connexion en cours…');
  try {
    const res = await fetch('/api/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ identifiant: $('lid').value, motDePasse: $('lpw').value }) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || 'Connexion impossible.');
    token = data.token; sessionStorage.setItem('edu_admin_token', token);
    $('who').textContent = data.utilisateur.prenom + ' ' + data.utilisateur.nom;
    say('loginMsg', '');
    await showApp();
  } catch (e) { say('loginMsg', e.message, 'err'); }
};
$('logout').onclick = showLogin;

async function loadStats() {
  const s = await api('/stats');
  $('stats').innerHTML = `<span><b>${s.eleves}</b> élèves</span><span><b>${s.leconsPubliees}</b> leçons publiées</span>` +
    `<span><b>${s.totalTelechargements}</b> téléchargements</span><span><b>${s.tauxCompletion} %</b> de complétion</span>` +
    `<span><b>${s.signalementsNouveaux}</b> signalement(s) à traiter</span>`;
}

async function loadLessons() {
  try {
    const st = $('fStatut').value;
    const list = await api('/lessons' + (st ? '?statut=' + st : ''));
    $('rows').innerHTML = list.map(l => `<tr>
      <td>${esc(l.classeNom)} · ${esc(l.matiereNom)}</td><td>${esc(l.chapitreTitre)}</td><td>${esc(l.titre)}</td>
      <td><span class="tag ${l.statut}">${l.statut}</span></td><td>v${l.version}${l.statut === 'Publiee' ? '' : ' (→ v' + l.versionSuivante + ')'}</td><td>${l.telechargements}</td>
      <td><button data-a="edit" data-id="${l.id}">Modifier</button>
          <button data-a="publish" data-id="${l.id}" class="primary">Publier</button>
          ${l.statut === 'Publiee' ? `<button data-a="unpublish" data-id="${l.id}">Dépublier</button>` : ''}
          ${l.statut !== 'Archivee' ? `<button data-a="archive" data-id="${l.id}" class="warn">Archiver</button>` : ''}</td></tr>`).join('');
    say('listMsg', list.length + ' leçon(s).');
  } catch (e) { say('listMsg', e.message, 'err'); }
}

async function loadChapters() {
  const ch = await api('/chapters');
  $('edChap').innerHTML = ch.map(c => `<option value="${c.id}">${esc(c.classeNom)} · ${esc(c.matiereNom)} · ${esc(c.titre)}</option>`).join('');
}

$('rows').onclick = async ev => {
  const b = ev.target.closest('button'); if (!b) return;
  const id = b.dataset.id, a = b.dataset.a;
  try {
    if (a === 'edit') {
      const l = await api('/lessons/' + id);
      editingId = id; $('editor').hidden = false; $('edTitle').textContent = 'Modifier : ' + l.titre;
      $('edChap').value = l.chapitreId; $('edName').value = l.titre; $('edDur').value = l.dureeMin;
      $('edBlocks').value = JSON.stringify(l.blocs || [], null, 2); say('edMsg', '');
      $('editor').scrollIntoView({ behavior: 'smooth' });
    } else {
      const r = await api('/lessons/' + id + '/' + a, { method: 'POST', json: {} });
      say('listMsg', a === 'publish' ? 'Publiée en version ' + r.version + '.' : 'Statut : ' + r.statut, 'ok');
      await Promise.all([loadLessons(), loadStats()]);
    }
  } catch (e) { say('listMsg', e.message, 'err'); }
};

$('newLesson').onclick = () => {
  editingId = null; $('editor').hidden = false; $('edTitle').textContent = 'Nouvelle leçon';
  $('edName').value = ''; $('edDur').value = 10; $('edBlocks').value = '[\n  { "type": "Heading", "text": "Titre de la leçon" },\n  { "type": "Paragraph", "text": "Contenu…" }\n]'; say('edMsg', '');
};

$('edSave').onclick = async () => {
  let blocs; try { blocs = JSON.parse($('edBlocks').value); } catch { return say('edMsg', 'JSON invalide.', 'err'); }
  const body = { chapitreId: $('edChap').value, titre: $('edName').value, dureeMin: +$('edDur').value, blocs };
  try {
    if (editingId) await api('/lessons/' + editingId, { method: 'PUT', json: body });
    else { const r = await api('/lessons', { method: 'POST', json: body }); editingId = r.id; }
    say('edMsg', 'Enregistré. Pensez à publier pour que les élèves reçoivent la modification.', 'ok');
    await loadLessons();
  } catch (e) { say('edMsg', e.message, 'err'); }
};

$('edUpload').onclick = async () => {
  if (!editingId) return say('edMsg', 'Enregistrez d’abord la leçon.', 'err');
  const f = $('edZip').files[0]; if (!f) return say('edMsg', 'Choisissez un fichier ZIP.', 'err');
  const fd = new FormData(); fd.append('file', f);
  try { const r = await api('/lessons/' + editingId + '/package', { method: 'POST', body: fd }); say('edMsg', r.message, 'ok'); }
  catch (e) { say('edMsg', e.message, 'err'); }
};

$('refresh').onclick = () => { loadLessons(); loadStats(); };
$('fStatut').onchange = loadLessons;
if (token) showApp().catch(showLogin);
</script>
</body>
</html>
